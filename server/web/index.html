<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>atto</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #f1f0ee; --text: #1d1d1b; --dim: #77756f; --line: #dddbd6;
  --accent: #1f7a8c; --user: #e9e7e2; --ok: #2f8a3e; --bad: #c2412d; --code: #f4f3f0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1c1e; --panel: #232427; --text: #e7e6e3; --dim: #8d8b86; --line: #34353a;
    --accent: #5cb8c9; --user: #2c2d31; --ok: #6cc07a; --bad: #e06a55; --code: #26272b; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; display: flex; }
button, select, textarea { font: inherit; color: inherit; }
#side { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#side header { padding: 14px 14px 8px; display: flex; align-items: center; gap: 8px; }
#side h1 { font-size: 16px; margin: 0; flex: 1; letter-spacing: .02em; }
#threads { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.thread { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
.thread:hover { background: var(--user); }
.thread.active { background: var(--user); }
.thread .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread .m { color: var(--dim); font-size: 12px; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#bar .grow { flex: 1; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#log { flex: 1; overflow-y: auto; padding: 16px; }
#log > div { max-width: 820px; margin: 0 auto 12px; }
.user { background: var(--user); padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; }
.agent { white-space: pre-wrap; word-wrap: break-word; }
.agent code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.agent pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; }
details { border-left: 2px solid var(--line); padding-left: 10px; }
summary { cursor: pointer; color: var(--dim); list-style: none; }
summary::-webkit-details-marker { display: none; }
details pre { margin: 6px 0 0; white-space: pre-wrap; font: 12.5px/1.45 ui-monospace, Menlo, monospace; color: var(--dim); max-height: 360px; overflow: auto; }
.cmd summary b { color: var(--text); font-weight: 600; }
.cmd .ok { color: var(--ok); } .cmd .bad { color: var(--bad); } .cmd .run { color: var(--accent); }
.note { color: var(--dim); font-size: 13px; }
#input { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
#input form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; min-height: 44px; max-height: 40vh; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); max-width: 220px; }
#menu { display: none; }
#login { max-width: 420px; margin: 18vh auto; padding: 0 16px; }
#login input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
@media (max-width: 720px) {
  #side { position: fixed; inset: 0 auto 0 0; z-index: 2; transform: translateX(-100%); transition: transform .2s; width: 82vw; }
  #side.open { transform: none; }
  #menu { display: inline-block; }
  select { max-width: 42vw; }
}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>atto</h2>
  <p class="note">Paste the token printed by <code>atto serve</code> (also in ~/.atto/server-token).</p>
  <form id="loginForm"><input id="tok" placeholder="token" autocomplete="off"></form>
</div>
<aside id="side" hidden>
  <header><h1>atto</h1><button id="new" title="New conversation">New</button></header>
  <div id="threads"></div>
</aside>
<main id="main" hidden>
  <div id="bar">
    <button id="menu">☰</button>
    <span class="grow" id="title">No conversation</span>
    <select id="model" title="Model"></select>
    <select id="effort" title="Effort"></select>
  </div>
  <div id="log"></div>
  <div id="input">
    <form id="send">
      <textarea id="text" rows="1" placeholder="Message atto" title="Enter to send, Shift+Enter for a new line"></textarea>
      <button class="primary" id="go">Send</button>
      <button type="button" id="stop" hidden>Stop</button>
    </form>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let token = new URLSearchParams(location.hash.slice(1)).get("token") || localStorage.getItem("atto-token") || "";
let current = null;             // ThreadInfo of the open thread
const items = new Map();        // itemId -> {el, item}
let rpcId = 0;

async function rpc(method, params = {}) {
  const r = await fetch("/rpc", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method, params }),
  });
  if (r.status === 401) { localStorage.removeItem("atto-token"); showLogin(); throw new Error("unauthorized"); }
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}

function esc(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
// Tiny markdown: fenced code, inline code, bold.
function md(s) {
  return esc(s).split(/```[^\n]*\n?/).map((part, i) =>
    i % 2 ? `<pre>${part}</pre>` : part.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  ).join("");
}

function render(it) {
  const el = document.createElement("div");
  update(el, it);
  return el;
}

function update(el, it) {
  switch (it.type) {
    case "userMessage": el.className = "user"; el.textContent = it.text; break;
    case "event": el.className = "note"; el.textContent = "◆ " + (it.text || "").replace(/^\[atto event\] /, ""); break;
    case "agentMessage": el.className = "agent"; el.innerHTML = md(it.text || ""); break;
    case "reasoning":
      el.innerHTML = `<details><summary>∴ Thinking</summary><pre></pre></details>`;
      el.querySelector("pre").textContent = it.text || ""; break;
    case "commandExecution": {
      const st = it.status === "inProgress" ? '<span class="run">●</span>' : it.status === "failed" ? '<span class="bad">✗</span>' : '<span class="ok">✓</span>';
      const meta = it.status === "inProgress" ? "running" : it.exitCode != null ? (it.exitCode ? `exit ${it.exitCode} · ` : "") + (it.durationMs / 1000).toFixed(1) + "s" : "";
      const open = el.querySelector("details")?.open;
      el.className = "cmd";
      el.innerHTML = `<details><summary>${st} <b></b> · ${esc(meta)} <code></code></summary><pre></pre></details>`;
      el.querySelector("b").textContent = it.description || "command";
      el.querySelector("code").textContent = "$ " + (it.command || "").split("\n")[0];
      el.querySelector("pre").textContent = it.output || "";
      if (open) el.querySelector("details").open = true;
      break;
    }
    case "compaction":
      el.innerHTML = `<details><summary>◇ Context compacted${it.tokensBefore ? ` · ${it.tokensBefore} → ~${it.tokensAfter} tokens` : ""}</summary><pre></pre></details>`;
      el.querySelector("pre").textContent = it.text || ""; break;
  }
}

function addItem(it) {
  let rec = items.get(it.id);
  if (!rec) {
    rec = { item: it, el: render(it) };
    items.set(it.id, rec);
    $("log").appendChild(rec.el);
  } else {
    rec.item = it;
    update(rec.el, it);
  }
  scrollDown();
}

function note(text) {
  const el = document.createElement("div");
  el.className = "note"; el.textContent = text;
  $("log").appendChild(el); scrollDown();
}

function scrollDown() {
  const log = $("log");
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 200) log.scrollTop = log.scrollHeight;
}

function setBusy(b) {
  if (current) current.busy = b;
  $("stop").hidden = !b;
  $("go").textContent = b ? "Steer" : "Send";
}

function showThread(info) {
  current = info;
  items.clear();
  $("log").innerHTML = "";
  (info.items || []).forEach(addItem);
  $("title").textContent = (info.name ? info.name + " · " : "") + info.cwd;
  fillEffort(info);
  $("model").value = info.model;
  setBusy(info.busy);
  document.querySelectorAll(".thread").forEach((t) => t.classList.toggle("active", t.dataset.id === info.threadId));
  $("side").classList.remove("open");
  $("log").scrollTop = $("log").scrollHeight;
}

function fillEffort(info) {
  $("effort").innerHTML = (info.efforts || []).map((e) => `<option>${esc(e)}</option>`).join("");
  $("effort").hidden = !(info.efforts || []).length;
  $("effort").value = info.effort;
}

async function loadThreads() {
  const threads = (await rpc("thread/list")).threads || [];
  $("threads").innerHTML = "";
  for (const t of threads) {
    const el = document.createElement("div");
    el.className = "thread"; el.dataset.id = t.threadId;
    el.innerHTML = `<div class="t"></div><div class="m"></div>`;
    el.querySelector(".t").textContent = t.name || t.preview || "(empty)";
    el.querySelector(".m").textContent = new Date(t.updatedAt).toLocaleString() + " · " + t.cwd.split("/").slice(-2).join("/");
    el.onclick = async () => showThread(await rpc("thread/resume", { threadId: t.threadId }));
    $("threads").appendChild(el);
  }
}

async function loadModels() {
  const models = (await rpc("models/list")).models || [];
  $("model").innerHTML = models.filter((m) => m.hasKey).map((m) => `<option value="${esc(m.id)}">${esc(m.name)} (${esc(m.id.split("/")[0])})</option>`).join("");
}

function connect() {
  const es = new EventSource("/events?token=" + encodeURIComponent(token));
  es.onmessage = (e) => {
    const n = JSON.parse(e.data), p = n.params;
    if (!current || p.threadId !== current.threadId) {
      if (n.method === "turn/completed") loadThreads();
      return;
    }
    switch (n.method) {
      case "turn/started": setBusy(true); break;
      case "item/started": case "item/completed": addItem(p.item); break;
      case "item/delta": {
        const rec = items.get(p.itemId);
        if (!rec) break;
        const it = rec.item;
        if (it.type === "commandExecution") it.output = (it.output || "") + p.delta; else it.text = (it.text || "") + p.delta;
        update(rec.el, it); scrollDown(); break;
      }
      case "hook": note("⚑ " + p.event + ": " + p.message); break;
      case "turn/completed":
        setBusy(false);
        if (p.status !== "completed") note(p.status + (p.error ? ": " + p.error : ""));
        loadThreads(); break;
    }
  };
}

$("send").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = ""; autosize();
  try {
    if (!current) showThread(await rpc("thread/start", { model: $("model").value }));
    if (current.busy) { await rpc("turn/steer", { threadId: current.threadId, input: text }); note("↳ steering: " + text); }
    else await rpc("turn/start", { threadId: current.threadId, input: text });
  } catch (err) { note("Error: " + err.message); }
};
$("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("send").requestSubmit(); } };
function autosize() { const t = $("text"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
$("text").oninput = autosize;
$("stop").onclick = () => current && rpc("turn/interrupt", { threadId: current.threadId });
$("new").onclick = async () => { showThread(await rpc("thread/start", { model: $("model").value })); loadThreads(); };
$("menu").onclick = () => $("side").classList.toggle("open");
$("model").onchange = async () => { if (current) { current = { ...current, ...(await rpc("thread/setModel", { threadId: current.threadId, model: $("model").value })) }; fillEffort(current); } };
$("effort").onchange = async () => { if (current) await rpc("thread/setEffort", { threadId: current.threadId, effort: $("effort").value }).catch((e) => note(e.message)); };

function showLogin() { $("login").hidden = false; $("side").hidden = $("main").hidden = true; }
$("loginForm").onsubmit = (e) => { e.preventDefault(); token = $("tok").value.trim(); start(); };

async function start() {
  try {
    await rpc("initialize");
  } catch { showLogin(); return; }
  localStorage.setItem("atto-token", token);
  history.replaceState(null, "", location.pathname);
  $("login").hidden = true; $("side").hidden = $("main").hidden = false;
  await loadModels();
  await loadThreads();
  connect();
}
token ? start() : showLogin();
</script>
</body>
</html>
