name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/atto

  # Every push to main becomes the rolling "edge" prerelease, once the tests
  # pass on all three systems. Tagged releases are release.yml's job.
  edge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # replace the edge release and tag
      id-token: write     # sign the build provenance
      attestations: write
    # Two quick pushes must not publish at the same time; the later one waits.
    concurrency:
      group: edge-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe needs the tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        # v<next>-dev.<N>+<sha7>: the last v* tag with its patch bumped, N
        # commits after it. For v0.0.2 plus 14 commits: v0.0.3-dev.14+abc1234.
        run: |
          desc=$(git describe --tags --long --abbrev=7 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*-*' 2>/dev/null \
            || echo "v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)")
          sha=${desc##*-g}
          rest=${desc%-g*}
          n=${rest##*-}
          tag=${rest%-*}
          IFS=. read -r major minor patch <<< "${tag#v}"
          echo "VERSION=v$major.$minor.$((patch + 1))-dev.$n+$sha" >> "$GITHUB_ENV"
      - name: Build
        run: |
          echo "Building $VERSION"
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            out=dist/atto_${os}_${arch}
            [ "$os" = windows ] && out=$out.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/sebastianrcnt/atto/update.Version=${VERSION}" \
              -o "$out" ./cmd/atto
          done
          (cd dist && sha256sum atto_* > checksums.txt)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/atto_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Recreate the release instead of editing it: stale assets and the
        # old tag go with it, and the new tag lands on this exact commit.
        # --prerelease and --latest=false keep it out of releases/latest, so
        # stable installs and "atto update" never see it.
        run: |
          printf 'Commit: %s/%s/commit/%s\n\nUnstable build of main, replaced on every push. Install with `ATTO_VERSION=edge`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > notes.md
          gh release delete edge --cleanup-tag --yes || true
          git push origin :refs/tags/edge || true
          gh release create edge dist/* \
            --title "$VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
